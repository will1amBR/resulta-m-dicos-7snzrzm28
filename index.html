<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resulta Médicos | Plataforma de Gestão Clínica e Prontuário</title>
    <meta
      name="description"
      content="Resulta Médicos - Plataforma unificada de gestão clínica, prontuário eletrônico seguro, teleconsulta e prescrições digitais conforme LGPD e CFM."
    />
    <meta name="author" content="Resulta Médicos" />
    <meta name="application-name" content="Resulta Médicos" />
    <meta name="apple-mobile-web-app-title" content="Resulta Médicos" />
    <meta name="theme-color" content="#2563eb" />
    <meta property="og:title" content="Resulta Médicos | Gestão Clínica e Prontuário Eletrônico" />
    <meta
      property="og:description"
      content="Ecossistema completo para médicos, clínicas e pacientes. Prescrição digital, teleconsulta e prontuário seguro."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <script>
      (function() {
        var host = window.location.hostname;
        var meta = document.createElement('meta');
        meta.name = 'robots';
        // Se for o domínio de produção oficial med.glikholding.com.br, indexa com controle;
        // caso contrário (previews, domínios internos/temporários, localhost), bloqueia indexação completamente.
        if (host === 'med.glikholding.com.br') {
          meta.content = 'index, follow';
        } else {
          meta.content = 'noindex, nofollow, noarchive, nosnippet';
        }
        document.head.appendChild(meta);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <!-- @skip-protected: Do not remove. Required for app features. -->
    <script src="https://goskip.dev/skip.js"></script>
    <!-- @skip-protected: Do not remove. App entrypoint. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
